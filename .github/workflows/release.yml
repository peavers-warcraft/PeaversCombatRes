name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  release:
    uses: peavers-code/peavers-warcraft-workflows/.github/workflows/release.yml@master
    with:
      toc_file: PeaversCombatRes.toc
      addon_name: PeaversCombatRes
      git_user_name: Chris Turner
      git_user_email: peavers@gmail.com
      use_self_hosted: true
      # No CurseForge project yet. Set this back to true (and add X-Curse-Project-ID
      # to the TOC) once it exists.
      publish_curseforge: false
    secrets: inherit
